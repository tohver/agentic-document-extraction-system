[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "policy-extractor"
version = "0.1.0"
description = "Insurance policy extraction with validation-driven retry, independent review, deterministic routing and sliced calibration."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.9",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "typer>=0.29",
]

[project.scripts]
policy-extractor = "policy_extractor.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "mypy>=2.4",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls the real Claude API; needs ANTHROPIC_API_KEY and costs money",
]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
